<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LIANO Marketplace</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f5f5f5;
      color: #222;
    }

    header {
      background: #111;
      color: white;
      padding: 22px 18px;
    }

    .logo {
      font-size: 28px;
      font-weight: bold;
      letter-spacing: 2px;
    }

    .tagline {
      margin-top: 6px;
      font-size: 14px;
      color: #ddd;
    }

    .container {
      padding: 20px 16px;
      max-width: 900px;
      margin: auto;
    }

    .search {
      width: 100%;
      padding: 15px;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-size: 16px;
      margin-bottom: 20px;
    }

    h2 {
      margin-bottom: 14px;
    }

    .categories {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }

    .category {
      background: white;
      padding: 22px 10px;
      border-radius: 12px;
      text-align: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      font-weight: bold;
    }

    .welcome {
      background: white;
      padding: 22px;
      border-radius: 12px;
      margin-top: 24px;
      line-height: 1.6;
    }

    footer {
      text-align: center;
      padding: 30px 15px;
      color: #777;
      font-size: 13px;
    }
  </style>
</head>

<body>

  <header>
    <div class="logo">LIANO</div>
    <div class="tagline">Buy. Sell. Hire. Connect.</div>
  </header>

  <main class="container">

    <input
      type="text"
      class="search"
      placeholder="What are you looking for?"
    >

    <h2>Explore LIANO</h2>

    <div class="categories">
      <div class="category">🛍️ Products</div>
      <div class="category">🛠️ Services</div>
      <div class="category">🏪 Sellers</div>
      <div class="category">👤 Service Providers</div>
    </div>

    <div class="welcome">
      <h2>Welcome to LIANO</h2>
      <p>
        Discover products, find trusted sellers, and connect with people
        offering useful services — all in one marketplace.
      </p>
    </div>

  </main>

  <footer>
    © 2026 LIANO Marketplace
  </footer>

</body>
</html>
